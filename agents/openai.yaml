interface:
  display_name: "Memory Audit Cleanup Export"
  short_description: "Classify, purge, merge and export every stored memory"
  default_prompt: "Use $memory-audit-cleanup-export-skill. Read every memory store in full, classify each entry as KEEP, SUPERSEDED, DUPLICATE, STALE, FAILING, NOT MINE or UNSAFE, apply all deletions, merges and rewrites directly (one entry per project, user wording preserved, no invented facts, secrets replaced by pointers only when another copy exists), rewrite each MEMORY.md index, re-read every change, then export the result as Instructions, Identity, Career, Projects and Preferences with [YYYY-MM-DD] lines in one code block, followed by before/after counts, deletions by reason, merges, failed writes and any unread slice."
